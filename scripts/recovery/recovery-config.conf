# =============================================================================
# recovery-config.conf
# Configuration file for the Auto-Recovery Agent (recovery.sh)
#
# Purpose:
#   Lists the systemd service names that the recovery agent will monitor.
#   One service name per line. Lines starting with '#' are treated as comments
#   and are ignored by the agent.
#
# Usage:
#   Add or remove service names to control what the agent monitors.
#   The agent reads this file on every check cycle, so changes take effect
#   without restarting the agent.
#
# Format:
#   <systemd-service-name>   (without the .service suffix)
#
# Example entries:
#   nginx
#   amazon-cloudwatch-agent
#   myapp
# =============================================================================

# Web server — monitor nginx availability
nginx

# CloudWatch Agent — ensure metrics are always being shipped
amazon-cloudwatch-agent

# Example application service — replace with your actual service name
# myapp
